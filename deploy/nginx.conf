# ---------------------------------------------------------------
# Nginx configuration for the portfolio site (VPS deployment).
# What Nginx does here, in plain words:
#   - Serves your built React website (plain static files) to visitors
#   - Forwards anything under /api/ to your Python backend, which
#     handles the contact form and sends email via your mail server
#   - Adds compression and security headers for speed and safety
#
# How to use: copy this file to /etc/nginx/sites-available/portfolio,
# replace "yourdomain.com" with your real domain (3 places), then:
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # The folder where your built website lives (created by "yarn build")
    root /var/www/portfolio/frontend/build;
    index index.html;

    # Compress text files so pages load faster on slow connections
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React is a single-page app: any unknown path loads index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have unique hashed names, so browsers can cache them a year
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Contact form API requests are forwarded to the Python backend
    # running privately on port 8001 (visitors never see that port)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Basic security headers (protect against common tricks)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
